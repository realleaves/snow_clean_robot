[pytest]
testpaths = tests
# ROS 2 registers two pytest11 entry points (`launch_testing`, `launch_ros`) whose
# import chain needs the `lark` package and which declare hooks this pytest version
# rejects. Neither is used by this project, so both are disabled to keep a plain
# `pytest` run working inside the project virtual environment. Equivalent:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest tests
addopts = -ra -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
